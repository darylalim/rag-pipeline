name: CI

# `push` is unscoped, so a branch gets CI before any PR exists. `pull_request`
# is a fork's only CI: a fork's PR makes no push event in this repo.
on:
  push:
  pull_request:

# Read-only whatever the repo's default token permissions: every job runs
# third-party code with checkout's token left in .git/config. A job that has to
# write raises its own permissions.
permissions:
  contents: read

jobs:
  # ruff and ty take their target version from requires-python, not from the
  # interpreter, so they run once rather than across the test matrix.
  lint:
    name: ruff + ty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # --locked, not --frozen: a uv.lock that has drifted from pyproject.toml
      # fails here, where --frozen would install it as-is and CI would pass.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Above pyproject's faulthandler_timeout (300 s), which only dumps a hung
    # test's stacks; a job cancelled before that never names the test. It is
    # also all that ends a run whose stuck worker thread holds the interpreter
    # open, silently, after pytest has reported. GitHub's default is six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # requires-python's floor, and the version .python-version pins.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
