[project]
name = "rag-pipeline"
version = "0.1.0"
description = "A RAG pipeline built with LangChain, MongoDB Atlas, Voyage AI and Claude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.2.5",
    "langchain-text-splitters>=1.0",
    "streamlit>=1.59",
    # 1.2.0 is the first to honour PYTHON_DOTENV_DISABLED, which the tests that
    # start a fresh interpreter set so a developer's .env stays out of the child.
    "python-dotenv>=1.2.0",
    "pypdf>=5.0",
    # The chat-model adapter is a pydantic model, as its langchain base class
    # is, and claude_model.py imports model_validator (and ingest.py SecretStr)
    # itself, so pydantic is declared directly rather than left to
    # langchain-core.
    "pydantic>=2.10",
    # Optional tracing to a self-hosted Phoenix (off unless
    # PHOENIX_COLLECTOR_ENDPOINT is set). pipeline.py opens its spans through
    # the OpenTelemetry API alone -- a no-op until a provider exists -- and
    # names their attributes with OpenInference's conventions, which is what
    # Phoenix reads. tracing.py builds the provider (the OpenInference one:
    # the SDK's own caps a span at 128 attributes, which a reranker span
    # passes from a FETCH_K of about 37), exports over OTLP/HTTP, and
    # instruments LangChain. All six are imported directly, so all six are
    # declared. Not arize-phoenix-otel: its register() cannot bound the
    # exporter's timeout, and reads PHOENIX_* settings from outside Settings.
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "openinference-semantic-conventions>=0.1.39",
    "openinference-instrumentation>=0.1.66",
    "openinference-instrumentation-langchain>=0.1.76",
    # `rag eval` (rag_pipeline/evaluation.py): the question set is a LangSmith
    # dataset and each run a LangSmith experiment. Imported directly, so
    # declared, though it also arrives through langchain-core.
    "langsmith>=0.14.1",
    # Claude, through its own SDK: the chat model (claude_model.py, an adapter
    # of our own because langchain-anthropic does not close a stream its
    # consumer abandons) and the eval's judge.
    "anthropic>=1.11.0",
    # The vector store: MongoDB Atlas, with Atlas Vector Search. pymongo is
    # declared directly because ingest.py imports it -- the client, search
    # index management, the writer lock, and pymongo.errors for the
    # RuntimeError translation -- not only through langchain-mongodb.
    "langchain-mongodb>=0.12.1",
    "pymongo>=4.18.2",
    # Voyage AI's embedder and reranker, behind LangChain's interfaces
    # (ingest.build_embeddings, pipeline.build_reranker); voyageai itself is
    # imported for its clients and errors, so it is declared too.
    "langchain-voyageai>=0.4.1",
    "voyageai>=0.5.0",
]

[project.scripts]
rag = "rag_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipeline"]

[dependency-groups]
dev = [
    # ExportTraceServiceRequest: test_tracing.py's stand-in collector decodes
    # what the exporter posts with OTLP's own protobuf types. The exporter's
    # floor, since each exporter release pins opentelemetry-proto to its own.
    "opentelemetry-proto>=1.44.0",
    # reset_trace_globals(): OpenTelemetry lets a process set its tracer
    # provider once, so the tests that record spans reset it between them.
    "opentelemetry-test-utils>=0.65b0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "ruff>=0.16.9",
    # The store tests run against MongoDB's atlas-local image in Docker, one
    # container per session (conftest's `atlas_uri`).
    "testcontainers>=4.15.0",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `addopts = "-q"`. Verbosity is a signed integer and flags sum rather than
# override, so a baseline of -1 rebases every flag typed after it: `-q` becomes
# -2, which prints nothing at all for a run that collected nothing (`-k` typo,
# exit 5) — indistinguishable on screen from a pass — and `-v` only reaches 0,
# pytest's default. Terseness is not worth a green-looking empty run.
#
# The one default flag is `-m "not live"`: tests marked `live` call the real
# Anthropic and Voyage AI APIs, with the developer's keys and at their expense,
# so a plain `uv run pytest` must never reach them. A later `-m` replaces this
# one, which is how they are opted into: `uv run pytest -m live`.
addopts = ["-m", "not live"]
# An exception in a worker thread, or one Python can only report rather than
# raise (in a finalizer, or a generator's cleanup), is a pytest *warning* by
# default: a lock test passed with five of its six workers crashed. These two
# categories only -- a blanket "error" would tie the suite to every
# dependency's deprecation schedule.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
# A test still running after this many seconds has every thread's stack dumped
# into the output, naming where it is stuck; the test is not failed for it.
# Well above the suite's own bounds (60s on a lock, 120s on a child
# interpreter), so a dump means a hang rather than a slow wait.
faulthandler_timeout = 300
markers = [
    "live: calls the real Anthropic and Voyage AI APIs (opt in with `-m live`; needs ANTHROPIC_API_KEY and VOYAGE_API_KEY)",
]

[tool.coverage.run]
# Follow the tests' child interpreters: streamlit_app.py's handling of a failed
# pipeline import runs only in the fresh ones the
# test_a_variable_refused_at_import_* tests start, so without this an on-demand
# coverage run reports it uncovered.
patch = ["subprocess"]

[tool.ruff.lint]
# Ruff's default rule set, extended. `extend-select` rather than `select`,
# because `select` *replaces* the default: when ruff 0.16 widened it (to 413
# rules in 0.16.9), the explicit list this file had silently left 219 of them
# off. Extended, a ruff upgrade that adds default rules reports their findings
# in that upgrade's own CI run. On top of the default, every stable rule of
# these families: pycodestyle and Pyflakes (E, W, F), import sorting (I), 3.11+
# idioms (UP), likely-bug patterns (B), simplifications (SIM), comprehensions
# (C4), pytest style (PT) -- which is what caught the over-broad
# `pytest.raises` in test_ingest.py -- ruff's own rules (RUF), and bandit's
# security checks (S): pickle, `yaml.load`, `shell=True`, `verify=False`,
# `eval`, a server bound to every interface, an HTTP call with no timeout.
extend-select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "S"]
# E501 is the formatter's job; leaving it on would double-report every long line
# and fight `ruff format` over strings and comments it can't split.
# S105-S107 take any string given to a name like `token` for a password, and in
# a model adapter a token is the tokenizer's (`_EMBED_TOKEN`). No setting here
# is a secret; GitHub's push protection and .gitignore keep real ones out.
ignore = ["E501", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
# In tests `assert` is how pytest checks (S101), and the subprocesses -- git in a
# scratch repository, a fresh interpreter -- run a fixed argv (S603, S607).
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["rag_pipeline"]


