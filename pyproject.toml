[project]
name = "rag-pipeline"
version = "0.1.0"
description = "A local RAG pipeline built with LangChain, Chroma, and MLX models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.2.5",
    "langchain-text-splitters>=1.0",
    "streamlit>=1.59",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    # The local models: mlx-lm loads all three checkpoints (text-only) and runs
    # generation; mlx is declared too because mlx_models.py imports mlx.core
    # itself. The models target Apple Silicon (MLX's Metal backend), so both are
    # declared macOS-only: the Linux CI legs never install them, which is why
    # every MLX import is lazy (inside mlx_models.py's loaders) and why the tests
    # inject fakes rather than models.
    "mlx>=0.32.2 ; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3 ; sys_platform == 'darwin'",
    # Chroma, the vector store: an in-process PersistentClient under
    # PERSIST_DIR. chromadb is declared directly because ingest.py imports it
    # (the client, its Settings, and chromadb.errors for the RuntimeError
    # translation), not only through langchain-chroma.
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    # Resolves model ids to their local snapshot with local_files_only=True, so
    # loading a model never reaches the network. Below 2 because transformers
    # (via mlx-lm) requires it, and an unconstrained resolve backtracks into a
    # transformers old enough to need a source build.
    "huggingface-hub>=1.24,<2",
    # Serializes ingests across processes: two writers on one persist dir at
    # once silently corrupt it (a CLI `rag ingest` during an app upload).
    "filelock>=4.0.3",
]

[project.scripts]
rag = "rag_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `addopts = "-q"`. Verbosity is a signed integer and flags sum rather than
# override, so a baseline of -1 rebases every flag typed after it: `-q` becomes
# -2, which prints nothing at all for a run that collected nothing (`-k` typo,
# exit 5) — indistinguishable on screen from a pass — and `-v` only reaches 0,
# pytest's default. Terseness is not worth a green-looking empty run.
#
# The one default flag is `-m "not models"`: tests marked `models` load the real
# MLX checkpoints (about 22 GB of weights, from the local Hugging Face cache), so
# a plain `uv run pytest` must never reach them. A later `-m` replaces this one,
# which is how they are opted into: `uv run pytest -m models`.
addopts = ["-m", "not models"]
markers = [
    "models: loads the real local MLX models (opt in with `-m models`; needs Apple Silicon and the models in the HF cache)",
]

[tool.ruff.lint]
# Beyond ruff's default (E4/E7/E9 + F): import sorting (I), 3.11+ idioms (UP),
# likely-bug patterns (B), and pytest style (PT), which is what caught the
# over-broad `pytest.raises` in test_ingest.py.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
# E501 is the formatter's job; leaving it on would double-report every long line
# and fight `ruff format` over strings and comments it can't split.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rag_pipeline"]

[tool.ty.analysis]
# The MLX stack is declared `; sys_platform == 'darwin'`, so it is absent from
# the Linux environment CI type-checks in. Treating its modules as Any on every
# platform keeps `uv run ty check` giving the same answer on a Mac as in CI —
# the alternative (allowing them unresolved) type-checks MLX call sites on a Mac
# only, where CI can never reproduce a finding. The cost is that MLX calls are
# untyped, which is why mlx_models.py keeps them thin.
replace-imports-with-any = ["mlx.**", "mlx_lm.**"]
